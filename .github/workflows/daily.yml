name: Daily job feed

on:
  schedule:
    # 10:15 UTC = 5:15 a.m. Boston in winter, 6:15 a.m. in summer.
    # GitHub sometimes starts scheduled runs late; that's fine here.
    - cron: "15 10 * * *"
  workflow_dispatch: # "Run workflow" button for a manual run

concurrency:
  group: daily-feed
  cancel-in-progress: false

permissions:
  contents: write # only used by the heartbeat step below

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Fetch, filter, and save jobs
        # Workday boards block cloud IPs; the daily job on Kojo's Mac fetches those (--where local).
        run: uv run jobsearch daily --where cloud
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      - name: Clean up old jobs and files
        if: ${{ !cancelled() }}
        run: uv run jobsearch cleanup
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      - name: Keep the schedule alive
        # GitHub turns off scheduled workflows in public repos after 60 days without
        # repository activity. If nothing was committed in 50 days, commit a heartbeat file.
        if: ${{ !cancelled() }}
        working-directory: .
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -lt $(( 50 * 86400 )) ]; then
            echo "Last commit is recent; no heartbeat needed."
            exit 0
          fi
          date -u +%Y-%m-%dT%H:%MZ > .github/heartbeat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/heartbeat
          git commit -m "chore: heartbeat (keeps the daily schedule enabled)"
          git push
