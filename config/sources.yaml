# Job-board aggregator: catches employers not listed above. Needs ADZUNA_APP_ID and
# ADZUNA_APP_KEY (free at developer.adzuna.com). Searches job titles near `token`, last 14
# days. Results from employers listed above are skipped (their own sites are complete), and
# descriptions are short snippets, so these jobs carry a "Short description" tag.
adzuna:
  - company: Adzuna
    token: Boston
    search_terms:
      - software engineer
      - software developer
      - web developer
      - machine learning
      - AI engineer
      - data analyst
      - data scientist
      - data engineer
      - program coordinator
      - program administrator
      - program manager
      - program assistant
      - program associate
      - project coordinator
      - administrative coordinator
      - systems analyst
      - educational technology
      - computational
      - bioinformatics
