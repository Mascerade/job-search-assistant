# Staffing and recruiting agencies: companies that post jobs on behalf of other employers.
#
# Their postings get a "Staffing agency" tag, and the daily tailoring writes documents for
# them only after every direct-employer match is done. You can still tailor one anytime with
# "Tailor now" on the job's page.
#
# Matching ignores capitals, punctuation, and "Inc"/"LLC"; a name also matches longer names
# that start with it ("Adecco" matches "Adecco US, Inc."). Companies whose names contain
# staffing / recruiting / recruitment / personnel / talent solutions / workforce solutions /
# search group are caught without being listed, and so are Adzuna postings written the way
# agencies write them ("Our client is seeking…"). Avoid short or place-like names here
# ("Beacon Hill" would also match the Beacon Hill Village nonprofit).
