# Job boards the daily search reads. Public information only — no secrets here.
#
# Each section is one careers platform. Add an employer by copying a line.
# Verified working on 2026-11-26.
#
# Not supported (no public feed; add their jobs with "Add job" on the website):
#   Big tech with custom career sites (Google, Microsoft, Amazon, MathWorks, Wayfair, Rapid7,
#   Pegasystems, Chewy), and these institutions:
#   Boston College (Cornerstone), MassArt (Interview Exchange), Boston Children's Hospital
#   (BrassRing), Cambridge Health Alliance (Infor), HigherEdJobs (blocks automated access),
#   Handshake (needs your login).

smartrecruiters:
  - {company: Harvard University, token: HarvardUniversity, kind: university,
     aliases: [Harvard, President and Fellows of Harvard College]}

peopleclick:
  - {company: MIT, token: client_mit, kind: university, aliases: [Massachusetts Institute of Technology]}

silkroad:
  - {company: Boston University, token: BU, feed_url: "https://jobs.silkroad.com/BU/External/rss", kind: university}

jibe:
  - {company: Tufts University, token: jobs.tufts.edu, kind: university, aliases: [Tufts]}

# Avature career sites: token is the host. Read from the HTML job pages (the RSS feed stops
# at 20 jobs and has no descriptions).
avature:
  - {company: Broad Institute, token: broadinstitute.avature.net, kind: research,
     aliases: [Broad, Broad Institute of MIT and Harvard]}

pageup:
  - {company: UMass Boston, token: umb, feed_url: "https://careers.pageuppeople.com/822/boston/en-us/rss/", kind: university,
     aliases: [University of Massachusetts Boston]}

workday:
  # Universities
  - {company: Northeastern University, token: northeastern, wd: 1, site: careers, kind: university}
  - {company: Brandeis University, token: brandeis, wd: 5, site: Jobs, kind: university}
  - {company: Wellesley College, token: wellesley, wd: 1, site: wellesley-staff, kind: university}
  - {company: Bentley University, token: bentley, wd: 503, site: staff, kind: university}
  - {company: Babson College, token: babson, wd: 1, site: Staff, kind: university}
  - {company: Emerson College, token: emerson, wd: 5, site: Emerson_College_Staff, kind: university}
  - {company: Suffolk University, token: suffolk, wd: 1, site: External, kind: university}
  - {company: Simmons University, token: simmons, wd: 504, site: Simmons-Careers, kind: university}
  - {company: Berklee College of Music, token: berklee, wd: 1, site: BerkleeCareers, kind: university}
  - {company: Lesley University, token: lesley, wd: 503, site: Lesley_University_Careers, kind: university}
  - {company: Wentworth Institute of Technology, token: wit, wd: 1, site: WIT, kind: university}
  # Hospitals and research institutes. The two biggest list 2000+ jobs (mostly clinical),
  # past Workday's limit, so they're searched by keyword instead.
  - company: Mass General Brigham
    token: massgeneralbrigham
    wd: 1
    site: MGBExternal
    kind: hospital
    aliases: [Massachusetts General Hospital, Mass General Hospital, Brigham and Women's Hospital, McLean Hospital]
    search_terms: [coordinator, program, administrator, analyst, software, developer, data, technology, engineer,
                   computational, bioinformatics]
  - company: Beth Israel Lahey Health
    token: bilh
    wd: 1
    site: External
    kind: hospital
    aliases: [Beth Israel Deaconess Medical Center, Lahey Hospital & Medical Center]
    search_terms: [coordinator, program, administrator, analyst, software, developer, data, technology, engineer,
                   computational, bioinformatics]
  - {company: Dana-Farber Cancer Institute, token: danafarber, wd: 5, site: dana-farber, kind: hospital}
  - {company: Boston Medical Center, token: bmc, wd: 1, site: BMC, kind: hospital}
  - {company: Whitehead Institute, token: wibr, wd: 1, site: WIBR-Careers, kind: research}
  # Tech companies on Workday
  - {company: DraftKings, token: draftkings, wd: 1, site: DraftKings}
  - {company: Moderna, token: modernatx, wd: 1, site: M_tx}
  - {company: Boston Dynamics, token: bostondynamics, wd: 1, site: Boston_Dynamics}
  - {company: Flywire, token: flywire, wd: 108, site: flywirecareers}

